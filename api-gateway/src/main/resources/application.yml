spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:3001
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
        
        - id: customer-service
          uri: http://localhost:3003
          predicates:
            - Path=/api/v1/customers/**,/api/v1/leads/**,/api/v1/test-drives/**,/api/v1/feedbacks/**,/api/v1/complaints/**
          filters:
            - StripPrefix=0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
